name: Dynamic Chat CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      CHROME_BIN: /usr/bin/google-chrome
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install pinned test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify browser availability
        run: |
          test -x "$CHROME_BIN"
          "$CHROME_BIN" --version

      - name: Build and validate plugin syntax
        run: npm run check

      - name: Reject stale generated artifacts
        run: git diff --exit-code -- hermes-dynamic-chat/plugin.js CHECKSUMS.sha256

      - name: Verify checksum
        run: sha256sum -c CHECKSUMS.sha256

      - name: Run regression tests
        run: npm test